name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Pike build
        id: cache-pike
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /usr/local/pike8.0
          key: pike-8.0.1116-v1
      - name: Install Pike
        if: steps.cache-pike.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libnettle-dev libgnutls28-dev libpcre3-dev zlib1g-dev
          cd /tmp
          curl -fsSL https://pike.lysator.liu.se/pub/pike/all/8.0.1116/Pike-v8.0.1116.tar.gz | tar xz
          cd Pike-v8.0.1116
          make -j$(nproc) prefix=/usr/local/pike8.0
          sudo make install prefix=/usr/local/pike8.0
      - name: Add Pike to PATH
        run: echo "/usr/local/pike8.0/bin" >> $GITHUB_PATH
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
